name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.9.30
      - run: uv sync --locked
      - run: uv run --locked pytest -q
      - name: Install browser
        if: matrix.python == '3.14'
        run: uv run --locked --with playwright==1.58.0 playwright install --with-deps chromium
      - name: Browser workflow
        if: matrix.python == '3.14'
        run: uv run --locked --with playwright==1.58.0 python tests/browser_flow.py
